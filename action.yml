name: 'Fidel Design Validation'
description: 'Validate rendered UI against Figma designs on every pull request. Posts severity-ranked issues with expected vs actual values. Zero-secret auth via GitHub OIDC.'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  config-path:
    description: 'Path to fidel.config.json'
    required: false
    default: 'fidel.config.json'
  github-token:
    description: 'GitHub token used to create or update the PR comment'
    required: false
    default: ${{ github.token }}
  fail-on-drift:
    description: 'Block the PR when Fidel confirms drift against a fully verified result. Default off. An incomplete result blocks regardless of this input.'
    required: false
    # Deliberately NO default. An unset input reads as '' and must stay
    # distinguishable from an explicit 'false', or every existing consumer of
    # fail-on-score would look like a conflicting configuration and be ignored.
  fail-on-score:
    description: 'DEPRECATED, use fail-on-drift. Fail the action if any successful check scores below this value (0-100). Ignored when fail-on-drift is set.'
    required: false
    default: '0'

outputs:
  score:
    description: 'DEPRECATED (removed in v4): use figma-score. Lowest score across successful checks'
  issues-count:
    description: 'DEPRECATED (removed in v4): use figma-issue-count. Total issue count across successful checks'
  # ── Result honesty (plan 051 P1-5) ──────────────────────────────────────
  # Set on EVERY exit path, including skips and fatal errors. An unset output
  # is an empty string, and an empty string reads as "fine" — so a consumer
  # must always find these populated.
  result:
    description: 'CI outcome: pass | fail_violation | incomplete | fail_operational'
  completeness:
    description: 'Evidence state: complete | partial | unverified | configuration_required | operational_failure'
  verified:
    description: 'true only when the full required scope was inspected'
  drift-count:
    description: 'DEPRECATED (removed in v4): use token-drift-count. Confirmed design-token drift only. For a Figma-only check this used to be the Figma issue total and is now 0, because Figma issues are not token drift'
  off-token-count:
    description: 'DEPRECATED (removed in v4): use token-off-token-count. Confirmed off-token violations: values using no design token. NOT drift, and never merged into drift-count'
  confirmed-violation-count:
    description: 'DEPRECATED (removed in v4): use token-confirmed-violation-count. token drift-count + token off-token-count'
  verdict:
    description: 'fidel.verdict/1 JSON. Figma issues and design-token counts are separate lanes'
  figma-score:
    description: 'Lowest Figma comparison score across successful checks. Empty when that lane did not run'
  figma-issue-count:
    description: 'Figma comparison issue total. Empty when that lane did not run. Never a token count'
  token-drift-count:
    description: 'Confirmed design-token drift. 0 when the token lane did not run, which is not a pass'
  token-off-token-count:
    description: 'Confirmed off-token violations from the design-token lane. 0 when that lane did not run'
  token-confirmed-violation-count:
    description: 'token-drift-count + token-off-token-count'
  blocked-by:
    description: 'none, figma, tokens, or figma,tokens. When both lanes block, figma is the primary label and this output still names both'
  unverified-count:
    description: 'Checks that reached no verdict'
  partial-reasons:
    description: 'Comma-separated closed-enum reasons the result is not complete'
  retryable:
    description: 'true when re-running could plausibly produce a different answer'
  # ── Drift enforcement (plan 051 P1-6) ───────────────────────────────────
  drift-enforcement:
    description: 'true when confirmed drift blocks this run. Never affects whether an incomplete result blocks'

runs:
  using: 'node24'
  pre: 'dist/setup.js'
  main: 'dist/index.js'
